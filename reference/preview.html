<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MINSO – Mining Agents (Preview)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#0E1012;--panel:#16191C;--panel2:#1D2125;--line:#2A2F35;--ink:#ECE8DF;--mute:#8E9299;--amber:#FFB81C;--amber-ink:#1A1300;--rock1:#23282D;--rock2:#2C3238;--rock3:#363D44;--rock4:#414951;--ok:#5DBB7A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Hanken Grotesk",system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;margin:0;line-height:.98;text-transform:uppercase;letter-spacing:.005em}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a{color:inherit;text-decoration:none;cursor:pointer}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,var(--amber) 0 12px,#0E1012 12px 24px)}
.btn{background:var(--amber);color:var(--amber-ink);border:0;padding:12px 22px;font-weight:600;border-radius:2px}
.btn:hover{filter:brightness(1.1)}.btn.line{background:none;color:var(--ink);border:1.5px solid var(--line)}.btn.line:hover{border-color:var(--amber)}
.logo{display:flex;align-items:center;gap:9px;font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:26px;text-transform:uppercase}
.top{display:flex;align-items:center;gap:26px;padding:14px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top nav{display:flex;gap:20px;margin-left:auto}.top nav a{color:var(--mute);padding:4px 0;border-bottom:2px solid transparent}.top nav a.on,.top nav a:hover{color:var(--ink);border-color:var(--amber)}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.hero{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:center;padding:56px 0}
.hero h1{font-size:clamp(52px,8vw,104px);margin-bottom:20px}
.hero h1 span{color:var(--amber)}
.hero p{color:var(--mute);font-size:18px;max-width:42ch;margin:0 0 28px}
.hero svg{width:100%;height:auto;display:block;border:1px solid var(--line)}
.foot{border-top:1px solid var(--line);padding:16px 28px;color:var(--mute);font-size:14px;display:flex;justify-content:space-between;gap:12px}
.foot a:hover{color:var(--amber)}
h2.pt{font-size:52px;margin:44px 0 8px}.sub{color:var(--mute);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;padding-bottom:48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;text-align:left;padding:0;display:flex;flex-direction:column;overflow:hidden}
button.card:hover{border-color:var(--amber)}
.card svg.art{width:100%;height:92px;display:block;border-bottom:1px solid var(--line)}
.card .b{padding:16px}.card h3{font-size:28px;margin-bottom:8px}.card p{margin:0 0 12px;color:var(--mute);font-size:15px}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);padding:1px 9px;font-size:13px;margin-right:6px;border-radius:2px}
.chat{max-width:820px;margin:0 auto;padding:22px 28px;display:flex;flex-direction:column;height:calc(100vh - 62px)}
.chead{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}.chead h2{font-size:34px}
.msgs{flex:1;overflow-y:auto;padding:18px 0;display:flex;flex-direction:column;gap:14px}
.m{max-width:86%;padding:12px 14px;border-radius:2px}.m.u{align-self:flex-end;background:var(--amber);color:var(--amber-ink)}
.m.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber)}
.m ul{margin:6px 0 10px;padding-left:20px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:3px 9px;font-size:13px;margin:2px 6px 0 0;border-radius:2px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.sugg button{background:var(--panel);border:1px solid var(--line);padding:7px 12px;font-size:14px;border-radius:2px}.sugg button:hover{border-color:var(--amber)}
.input{display:flex;gap:10px}.input input{flex:1;min-width:0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:2px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
/* admin */
.login{max-width:380px;margin:12vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--amber)}
.login h2{font-size:40px;margin-bottom:6px}.login input{width:100%;padding:12px;margin:14px 0;background:var(--bg);border:1px solid var(--line);border-radius:2px}
.err{color:#FF7A6B;font-size:14px;min-height:20px}
.adm{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.side .logo{padding:0 8px 4px}.badge{margin:0 8px 16px;font-size:12px;color:var(--amber);border:1px solid var(--amber);padding:0 7px;width:max-content;border-radius:2px}
.side a{padding:9px 12px;color:var(--mute);border-radius:2px;display:block}.side a.on{color:var(--ink);background:var(--panel2);box-shadow:inset 3px 0 var(--amber)}.side a.dis{opacity:.4;cursor:default}
.side .sp{flex:1}
.am{padding:28px;min-width:0}.am h2{font-size:44px;margin-bottom:6px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}th{color:var(--mute);font-weight:500;font-size:13px}
.st{font-size:13px;padding:1px 9px;border-radius:2px;border:1px solid var(--line)}.st.pub{color:var(--ok);border-color:var(--ok)}
.sw{position:relative;display:inline-block;width:44px;height:24px}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;background:var(--rock3);border-radius:12px;transition:.15s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}.sw input:checked+i{background:var(--amber)}.sw input:checked+i:after{left:23px}
.sw input:focus-visible+i{outline:3px solid var(--amber);outline-offset:2px}
.box{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:18px}.box h3{font-size:26px;margin-bottom:10px}
textarea{width:100%;min-height:96px;background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:32px 0}.top nav{margin-left:0;width:100%}.adm{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line)}.side .sp{display:none}.badge{margin:0}.chat{height:calc(100vh - 110px);padding:16px}.am{padding:18px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="hat" viewBox="0 0 32 32"><path d="M4 22a12 12 0 0 1 24 0z" fill="#FFB81C"/><rect x="2" y="22" width="28" height="4" rx="1.5" fill="#FFB81C"/><rect x="14" y="7" width="4" height="15" fill="#1A1300" opacity=".55"/></symbol>
<symbol id="scale" viewBox="0 0 24 24"><path d="M12 3v18M6 21h12M4 7h16M4 7l-3 8a3.5 3.5 0 0 0 6 0zM20 7l-3 8a3.5 3.5 0 0 0 6 0z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
</defs></svg>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const agents=[
{id:'rajasthan-mining-law',name:'Rajasthan Mining Law Assistant',desc:'Ask about mining acts, rules and lease procedures.',tags:['Law','Rajasthan'],published:true,instr:'Answer only from the provided sources. Cite the section and page. If unsure, say you don\'t know.',docs:['MMDR Act 1957.pdf','Rajasthan Minor Mineral Concession Rules 2017.pdf']},
{id:'mine-safety-sop',name:'Mine Safety SOP Assistant',desc:'Step-by-step safety procedures for workers.',tags:['Safety','SOP'],published:false,instr:'Answer only from approved SOPs. Be brief and list steps in order.',docs:[]}];
let authed=false;
const A=id=>agents.find(a=>a.id===id);
const strata=`<rect y="30" width="290" height="20" fill="var(--rock2)"/><rect y="50" width="290" height="20" fill="var(--rock3)"/><rect y="70" width="290" height="22" fill="var(--rock4)"/><path d="M0 86L290 44" stroke="var(--amber)" stroke-width="6"/><polyline points="20,30 60,30 60,42 90,42 90,54 200,54 200,42 230,42 230,30 270,30" fill="none" stroke="var(--ink)" stroke-width="2.5"/>`;
const art=`<svg class="art" viewBox="0 0 290 92" preserveAspectRatio="none"><rect width="290" height="92" fill="var(--rock1)"/>${strata}</svg>`;
function topbar(on){return `<header class="top"><a class="logo" href="#/"><svg width="32" height="32"><use href="#hat"/></svg>MINSO.AI</a><nav><a href="#/" class="${on==='h'?'on':''}">Home</a><a href="#/agents" class="${on==='a'?'on':''}">Agents</a></nav></header>`}
const foot=`<footer class="foot"><span>Preview build. Replies are sample text.</span><a href="#/admin">Admin</a></footer>`;
const pit=`<svg viewBox="0 0 600 320" role="img" aria-label="Cross-section of an open-pit mine with a haul truck on the lowest bench"><rect width="600" height="320" fill="var(--panel)"/><rect y="130" width="600" height="60" fill="var(--rock2)"/><rect y="190" width="600" height="50" fill="var(--rock3)"/><rect y="240" width="600" height="40" fill="var(--rock4)"/><rect y="280" width="600" height="40" fill="#4C555E"/><path d="M0 268L600 200L600 218L0 286z" fill="var(--amber)"/><polygon points="60,130 130,130 130,160 170,160 170,190 210,190 210,220 250,220 250,250 350,250 350,220 390,220 390,190 430,190 430,160 470,160 470,130 540,130 540,129 60,129" fill="var(--panel)"/><polyline points="60,130 130,130 130,160 170,160 170,190 210,190 210,220 250,220 250,250 350,250 350,220 390,220 390,190 430,190 430,160 470,160 470,130 540,130" fill="none" stroke="var(--ink)" stroke-width="3"/><rect x="278" y="234" width="34" height="12" fill="var(--ink)"/><path d="M312 234h12l6 8v4h-18z" fill="var(--amber)"/><circle cx="286" cy="248" r="5" fill="#000"/><circle cx="320" cy="248" r="5" fill="#000"/><path d="M562 130v-46h30M562 98h30" stroke="var(--mute)" stroke-width="2" fill="none"/></svg>`;
function home(){return topbar('h')+`<div class="hazard"></div><div class="wrap"><div class="hero"><div><h1>Ask the mining <span>paperwork.</span></h1><p>AI agents for the mining industry. Each one reads its own documents and shows the page every answer came from.</p><button class="btn" onclick="location.hash='#/agents'">Browse agents</button></div>${pit}</div></div>`+foot}
function agentsPage(){const l=agents.filter(a=>a.published).map(a=>`<button class="card" onclick="location.hash='#/agents/${a.id}'" aria-label="Open ${a.name}">${art}<div class="b"><h3>${a.name}</h3><p>${a.desc}</p>${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></button>`).join('');
return topbar('a')+`<div class="wrap"><h2 class="pt">Agents</h2><p class="sub">Pick an agent and start asking.</p><div class="grid">${l}</div></div>`+foot}
function chat(a){return topbar('a')+`<div class="chat"><div class="chead"><button class="btn line" onclick="location.hash='#/agents'">Agents</button><svg width="28" height="28" style="color:var(--amber)"><use href="#scale"/></svg><h2>${a.name}</h2></div><div class="msgs" id="msgs"><div class="m a">Hello. I answer from my documents and show the source for every answer. If they don't cover it, I'll say so.</div></div><div class="sugg" id="sugg"><button>How do I renew a minor mineral lease?</button><button>What is the royalty on limestone?</button><button>What must a mine do before blasting?</button></div><div class="input"><input id="q" placeholder="Ask a question" aria-label="Your question"><button class="btn" id="send">Send</button></div><div class="note">Preview only: replies are sample text and sources are placeholders.</div></div>`}
function bindChat(){const msgs=$('#msgs');
const add=(c,h)=>{const d=document.createElement('div');d.className='m '+c;d.innerHTML=h;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d};
const ask=t=>{t=t.trim();if(!t)return;$('#sugg').style.display='none';$('#q').value='';add('u',t.replace(/</g,'&lt;'));const w=add('a','<span class="dots"><i></i><i></i><i></i></span>');
setTimeout(()=>{w.innerHTML='Sample answer in the shape the real one will have:<ul><li>A short, plain-language summary of the rule.</li><li>The steps or conditions, in order.</li><li>A note where the documents are silent.</li></ul><span class="chip"><svg width="14" height="14"><use href="#scale"/></svg>Rajasthan Minor Mineral Concession Rules, 2017 · p. 12</span><span class="chip"><svg width="14" height="14"><use href="#scale"/></svg>MMDR Act, 1957 · Sec. 8</span>'},1000)};
$('#send').onclick=()=>ask($('#q').value);$('#q').onkeydown=e=>{if(e.key==='Enter')ask(e.target.value)};$('#sugg').onclick=e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent)}}
function login(){return `<div class="login"><div class="logo"><svg width="30" height="30"><use href="#hat"/></svg>MINSO.AI</div><h2>Admin sign in</h2><label for="pw" style="color:var(--mute);font-size:14px">Password (preview: type admin)</label><input id="pw" type="password" autocomplete="off"><div class="err" id="err"></div><button class="btn" id="go">Sign in</button> <button class="btn line" onclick="location.hash='#/'">Back to site</button></div>`}
function shell(on,inner){return `<div class="adm"><aside class="side"><div class="logo"><svg width="28" height="28"><use href="#hat"/></svg>MINSO.AI</div><span class="badge">Admin</span><a href="#/admin/agents" class="${on?'on':''}">Agents</a><a class="dis">Documents (soon)</a><a class="dis">Questions asked (soon)</a><div class="sp"></div><a href="#/">View public site</a><a id="out">Sign out</a></aside><main class="am">${inner}</main></div>`}
const sw=a=>`<label class="sw"><input type="checkbox" data-id="${a.id}" ${a.published?'checked':''} aria-label="Published"><i></i></label>`;
function admList(){return shell(1,`<h2>Agents</h2><p class="sub">Only published agents appear on the public site.</p><table><tr><th>Agent</th><th>Documents</th><th>Status</th><th>Published</th><th></th></tr>${agents.map(a=>`<tr><td>${a.name}</td><td>${a.docs.length}</td><td><span class="st ${a.published?'pub':''}" id="st-${a.id}">${a.published?'Published':'Draft'}</span></td><td>${sw(a)}</td><td><a href="#/admin/agents/${a.id}" style="color:var(--amber)">Edit</a></td></tr>`).join('')}</table>`)}
function admAgent(a){return shell(1,`<p><a href="#/admin/agents" style="color:var(--mute)">← Agents</a></p><h2>${a.name}</h2><p class="sub">Edit how this agent behaves and what it knows.</p><div class="box"><h3>Instructions</h3><textarea aria-label="Instructions">${a.instr}</textarea></div><div class="box"><h3>Documents</h3><div id="docs">${a.docs.map(d=>`<div class="row"><span>${d}</span><span class="st pub">Indexed</span></div>`).join('')||'<div class="sub" style="margin:0">No documents yet. Upload a PDF to start.</div>'}</div><p><button class="btn line" id="up">Upload PDF</button></p></div><div class="box"><h3>Visibility</h3><div class="row"><span>Show on public site</span>${sw(a)}</div></div>`)}
function route(){const h=location.hash.replace(/^#/,'')||'/',p=h.split('/').filter(Boolean);let html;
if(p[0]==='admin'){if(!authed)html=login();else if(p[1]==='agents'&&p[2]&&A(p[2]))html=admAgent(A(p[2]));else html=admList()}
else if(p[0]==='agents'&&p[1]&&A(p[1])&&A(p[1]).published)html=chat(A(p[1]));
else if(p[0]==='agents')html=agentsPage();else html=home();
app.innerHTML=html;window.scrollTo(0,0);
if($('#msgs'))bindChat();
if($('#go')){const t=()=>{if($('#pw').value==='admin'){authed=true;location.hash='#/admin/agents'}else $('#err').textContent='Wrong password. Enter it again.'};$('#go').onclick=t;$('#pw').onkeydown=e=>{if(e.key==='Enter')t()}}
if($('#out'))$('#out').onclick=()=>{authed=false;location.hash='#/'};
document.querySelectorAll('.sw input').forEach(i=>i.onchange=()=>{const a=A(i.dataset.id);a.published=i.checked;const s=$('#st-'+a.id);if(s){s.textContent=a.published?'Published':'Draft';s.classList.toggle('pub',a.published)}});
if($('#up'))$('#up').onclick=()=>{const d=$('#docs');if(!d.querySelector('.row'))d.innerHTML='';d.insertAdjacentHTML('beforeend','<div class="row"><span>new-document.pdf</span><span class="st pub">Indexed</span></div>')}}
addEventListener('hashchange',route);route();
</script></body></html>
